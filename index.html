<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>多位數切切樂</title>
  <!-- 發佈：把本檔存為 index.html，可直接放到 GitHub Pages 或 Vercel（無需 bundler） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ff8fab; --pink-deep: #ef5f8a;
      --mint: #7ce0c3; --mint-deep: #3cbc9a;
      --lemon: #ffe066; --lemon-deep: #e4b82a;
      --lilac: #cbb2fe; --lilac-deep: #9d7af0;
      --sky: #8ecaff; --sky-deep: #4ea2f0;
      --peach: #ffc09f;
      --ink: #3b2a4a; --soft: #7a6588;
      --digit: #ff8fab; --digit-shadow: #e45b86;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed; inset: 0;
      font-family: "Noto Sans TC", "PingFang HK", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 12%, #ffd6e8 0 16%, transparent 17%),
        radial-gradient(circle at 90% 10%, #c9f4e8 0 14%, transparent 15%),
        radial-gradient(circle at 86% 88%, #ffe9b3 0 16%, transparent 17%),
        linear-gradient(165deg, #fff3ea, #ffe8f2 50%, #eafbf6);
      user-select: none;
    }
    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; }
    input, textarea { user-select: text; -webkit-user-select: text; }

    @keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0% { transform: scale(1); } 35% { transform: scale(0.88); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 6px 0 var(--pink-deep), 0 0 0 0 rgba(255, 93, 143, 0.45); }
      50% { box-shadow: 0 6px 0 var(--pink-deep), 0 0 0 14px rgba(255, 93, 143, 0); }
    }
    .bounce { animation: bounce 0.35s ease; }
    .shake { animation: shake 0.4s ease; }

    .app {
      height: 100%; width: 100%; overflow: hidden; display: flex;
      padding: calc(8px + var(--safe-t)) calc(12px + var(--safe-r)) calc(8px + var(--safe-b)) calc(12px + var(--safe-l));
    }
    .screen {
      display: none; width: min(1080px, 100%); margin: 0 auto;
      height: 100%; min-height: 0; flex-direction: column; overflow: hidden;
      animation: popIn 0.35s ease;
    }
    .screen.active { display: flex; }
    .card {
      background: rgba(255,255,255,0.9); border: 3px solid #fff; border-radius: 28px;
      box-shadow: 0 14px 32px rgba(255, 93, 143, 0.16); min-height: 0;
    }
    .candy {
      border: 0; border-radius: 999px; font-weight: 900; padding: 10px 18px;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .candy:hover { filter: brightness(1.04); }
    .candy:active { transform: translateY(4px) scale(0.96); box-shadow: 0 2px 0 rgba(0,0,0,0.12) !important; animation: bounce 0.3s ease; }
    .pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-deep); }
    .mint { background: var(--mint); color: #165f4c; box-shadow: 0 6px 0 var(--mint-deep); }
    .lemon { background: var(--lemon); color: var(--ink); box-shadow: 0 6px 0 var(--lemon-deep); }
    .lilac { background: var(--lilac); color: #fff; box-shadow: 0 6px 0 var(--lilac-deep); }
    .sky { background: var(--sky); color: #123b63; box-shadow: 0 6px 0 var(--sky-deep); }
    .peach { background: var(--peach); color: var(--ink); box-shadow: 0 6px 0 #f09468; }
    .ghost { background: #fff; color: var(--soft); box-shadow: 0 5px 0 #ecd6de; }

    #screen-login { align-items: center; justify-content: center; }
    .login { width: min(400px, 100%); padding: 22px 22px 16px; text-align: center; }
    .mascot {
      width: 72px; height: 72px; margin: 0 auto 6px; border-radius: 50%;
      display: grid; place-items: center; font-size: 36px; background: #fff;
      box-shadow: 0 8px 0 #ffc2d6; animation: floaty 2.8s ease-in-out infinite;
    }
    .title {
      font-family: "Fredoka", "Noto Sans TC", sans-serif;
      font-size: clamp(28px, 6vh, 42px); font-weight: 900; letter-spacing: 0.04em;
      margin-bottom: 14px; line-height: 1.15;
    }
    .title span:nth-child(odd) { color: var(--pink-deep); }
    .title span:nth-child(even) { color: #7b4bff; }
    .field { text-align: left; margin-bottom: 10px; }
    .field label { display: block; font-weight: 900; font-size: 15px; margin-bottom: 4px; }
    .field input {
      width: 100%; border: 3px solid #ffe1ec; border-radius: 16px;
      padding: 10px 12px; font-size: 18px; font-weight: 800; outline: none; background: #fff;
    }
    .field input:focus { border-color: var(--pink); }
    .start { width: 100%; font-size: 22px; padding: 12px; margin: 6px 0 10px; }
    .teacher-btn {
      width: 64px; height: 64px; border-radius: 50%; font-size: 13px; line-height: 1.15;
      padding: 0; margin: 4px auto 0; display: grid; place-items: center;
    }
    .login-acts {
      display: flex; flex-wrap: nowrap; justify-content: center; align-items: center;
      gap: 22px; margin-top: 4px;
    }
    .login-acts .teacher-btn {
      margin: 0; padding: 0; width: 64px; height: 64px; min-width: 64px;
      flex: 0 0 64px; font-size: 13px; line-height: 1.2;
    }
    .rank-note {
      flex-shrink: 0; font-family: "Fredoka", "Noto Sans TC", sans-serif;
      font-weight: 900; font-size: clamp(24px, 3.6vh, 32px); line-height: 1.3;
      color: var(--pink-deep); text-align: center; letter-spacing: 0.04em;
    }
    tr.r1 td { background: #fff6c9; }
    tr.r2 td { background: #eef2f7; }
    tr.r3 td { background: #f8ead8; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; margin-bottom: 8px; overflow: visible; }
    .pill {
      background: #fff; border-radius: 999px; padding: 6px 12px;
      font-weight: 800; font-size: 14px; box-shadow: 0 4px 0 #f0d7e2; white-space: nowrap;
    }
    .timer-wrap { position: relative; flex-shrink: 0; }
    .timer { font-variant-numeric: tabular-nums; background: #fff8d9; min-width: 92px; text-align: center; }
    .timer.low, .timer.hit { background: #ffd0d8; color: #b42318; }
    .timer.hit { animation: shake 0.4s ease; }
    .time-hit {
      position: absolute; left: 50%; top: 50%; z-index: 3;
      font-weight: 900; font-size: 16px; color: #b42318;
      pointer-events: none; opacity: 0; white-space: nowrap;
      text-shadow: 0 1px 0 #fff, 0 0 8px #fff;
    }
    .time-hit.show { animation: timeHitPop 0.7s ease; }
    @keyframes timeHitPop {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
      22% { opacity: 1; transform: translate(-50%, -110%) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -160%) scale(0.96); }
    }
    .tiny { padding: 6px 12px; font-size: 13px; }

    .play { flex: 1; min-height: 0; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .task-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-shrink: 0; }
    .task-h h2 { font-size: clamp(18px, 2.6vh, 24px); }
    .task-h p { font-size: 14px; font-weight: 900; color: var(--soft); }

    .board {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #fff, #fff8fb); border-radius: 22px; overflow: hidden;
    }
    .number-row { display: flex; align-items: center; transform-origin: center center; }
    .digit {
      width: 68px; height: 80px; border-radius: 20px; display: grid; place-items: center;
      font-size: 40px; font-weight: 900; color: #fff; background: var(--digit);
      box-shadow: 0 6px 0 var(--digit-shadow); flex-shrink: 0;
    }
    .gap { width: 36px; height: 80px; border: 0; background: transparent; display: grid; place-items: center; flex-shrink: 0; }
    .gap::before { content: ""; width: 5px; height: 52px; border-radius: 99px; border: 2.5px dashed #f3c6d6; }
    .gap:hover::before, .gap:focus-visible::before { background: #ffd6e5; border-style: solid; border-color: var(--pink-deep); }
    .gap.cut { pointer-events: none; }
    .gap.cut::before { display: none; }
    .flag { min-width: 38px; padding: 7px 6px; border-radius: 14px; font-weight: 900; font-size: 16px; background: var(--lemon); box-shadow: 0 4px 0 var(--lemon-deep); }
    .flag.yi { background: var(--lilac); color: #fff; box-shadow: 0 4px 0 var(--lilac-deep); }

    .toast {
      display: none; flex-shrink: 0; background: #fff1f1; border: 2px solid #ffb4b4;
      color: #b42318; border-radius: 16px; padding: 8px 12px; font-weight: 900; font-size: 16px; text-align: center;
    }
    .toast.show { display: block; }
    .okbar { display: none; flex-shrink: 0; text-align: center; }
    .okbar.show { display: block; }
    .okbar .candy { font-size: 18px; padding: 10px 22px; }

    .segs { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
    .seg {
      background: #fff; border-radius: 14px; padding: 6px 10px;
      font-size: clamp(16px, 2.8vh, 24px); font-weight: 900; letter-spacing: 0.06em; box-shadow: 0 4px 0 #f0d7e2;
    }
    .seg b { color: var(--pink-deep); margin: 0 3px; font-size: 0.72em; }

    .dictation { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .answer-label { font-size: 13px; font-weight: 900; color: var(--soft); text-align: center; }
    .answer-input {
      width: 100%; min-height: 56px; max-height: 72px; resize: none;
      border: 3px solid #ffd9a8; border-radius: 18px; padding: 8px 12px;
      font-size: clamp(20px, 3.2vh, 28px); font-weight: 900; text-align: center;
      letter-spacing: 0.06em; line-height: 1.35; background: #fffdf7; color: var(--ink);
      outline: none; overflow: auto; user-select: text; -webkit-user-select: text;
    }
    .answer-input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255, 141, 171, 0.25); }
    .answer-input.live { border-color: var(--pink-deep); background: #fff5f8; }
    .answer-input::placeholder { color: #d2b8c4; font-weight: 800; letter-spacing: 0; font-size: 16px; }

    .speak-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-shrink: 0; }
    .langs { display: flex; gap: 6px; }
    .langs button {
      border: 0; border-radius: 999px; padding: 4px 10px; font-weight: 900; font-size: 13px;
      background: #fff; color: var(--soft); box-shadow: 0 3px 0 #ecd6de;
    }
    .langs button.on { background: var(--lemon); color: var(--ink); box-shadow: 0 3px 0 var(--lemon-deep); }
    .mic {
      min-width: 148px; height: 52px; border-radius: 999px; border: 0;
      background: var(--pink); color: #fff; font-size: 15px; font-weight: 900; padding: 0 16px;
      box-shadow: 0 6px 0 var(--pink-deep); touch-action: manipulation;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    }
    .mic.listen { animation: pulse 1.1s ease infinite; background: #ff5d8f; }
    .mic:disabled { pointer-events: auto; opacity: 1; cursor: pointer; filter: none; }

    .pad { flex-shrink: 0; }
    .keys { display: flex; flex-wrap: nowrap; gap: 6px; justify-content: center; margin-bottom: 6px; }
    .key { min-width: 42px; height: 40px; border-radius: 14px; font-size: 17px; font-weight: 900; padding: 0 8px; flex: 0 0 auto; }
    .acts { display: flex; gap: 8px; }
    .acts .candy { flex: 1; padding: 8px; font-size: 16px; }

    .report {
      position: fixed; inset: 0; background: rgba(59, 42, 74, 0.45);
      display: none; place-items: center; z-index: 25; padding: 16px;
    }
    .report.show { display: grid; }
    .report-card {
      width: min(520px, 100%); background: #fff; border-radius: 32px;
      padding: 22px 20px 18px; text-align: center; border: 4px solid #fff;
      box-shadow: 0 18px 40px rgba(255, 93, 143, 0.28); animation: popIn 0.4s ease;
    }
    .report-card h2 { font-size: clamp(22px, 3.4vh, 28px); margin: 8px 0 10px; }
    .report-card p { font-weight: 800; line-height: 1.55; margin: 8px 0; font-size: 16px; }
    .tip {
      background: #fff8d9; border-radius: 18px; padding: 12px 14px; margin: 12px 0 16px;
      font-weight: 800; line-height: 1.6; text-align: left;
    }

    .dash-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-shrink: 0; margin-bottom: 8px; }
    .dash-h h1 { font-family: "Fredoka", "Noto Sans TC", sans-serif; font-size: clamp(20px, 3vh, 28px); }
    .dash-h .acts { margin: 0; flex-shrink: 0; flex-wrap: nowrap; }
    .dash-h .acts .candy {
      flex: 0 0 auto; white-space: nowrap; padding: 6px 12px; font-size: 13px;
    }
    .dash { flex: 1; min-height: 0; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex-shrink: 0; }
    .stat { border-radius: 16px; padding: 10px; }
    .stat b { display: block; font-size: 12px; opacity: 0.8; }
    .stat strong { font-size: clamp(16px, 2.6vh, 24px); display: block; line-height: 1.2; }
    .s1 { background: #ffe1ea; } .s2 { background: #d9f8ee; } .s3 { background: #fff1c7; }
    .tools { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 8px; flex-wrap: wrap; }
    .tools select, .tools button.tiny { border: 2px solid #ffe1ec; border-radius: 12px; padding: 4px 8px; font-weight: 800; background: #fff; }
    .tool-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dash-src { font-size: 12px; font-weight: 800; color: var(--soft); }
    .dash-count { font-size: 12px; font-weight: 800; color: var(--soft); }
    .records { flex: 1; min-height: 0; overflow: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(59,42,74,0.08); font-size: 12px; }
    th { background: #fff3f8; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
    th.col-h { padding-right: 4px; }
    .col-sort { border: 0; background: transparent; font: inherit; font-weight: 900; cursor: pointer; padding: 0; }
    th.sorted .col-sort { color: #ef5f8a; }
    .filter-btn {
      border: 0; background: #ffe1ec; color: var(--ink); cursor: pointer;
      border-radius: 8px; width: 22px; height: 22px; margin-left: 4px;
      font-size: 12px; font-weight: 900; line-height: 1; vertical-align: middle;
    }
    .filter-btn.on { background: var(--pink); color: #fff; }
    .score-cell { font-variant-numeric: tabular-nums; font-weight: 900; text-align: center; }
    th.score-h, td.rank-cell { text-align: center; font-variant-numeric: tabular-nums; }
    tr.hi .score-cell { color: #165f4c; }
    tr.lo .score-cell { color: #b42318; }
    .empty { text-align: center; padding: 20px; font-weight: 800; color: var(--soft); }
    .filter-menu {
      position: fixed; z-index: 30; width: min(280px, calc(100vw - 16px));
      background: #fff; border-radius: 18px; padding: 10px;
      box-shadow: 0 16px 36px rgba(59,42,74,0.24); border: 2px solid #ffe1ec;
      display: none; flex-direction: column; gap: 8px; max-height: min(420px, 70vh);
    }
    .filter-menu.show { display: flex; }
    .filter-menu .fm-title { font-weight: 900; font-size: 14px; text-align: left; }
    .filter-menu .fm-acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-menu .fm-acts button {
      border: 0; border-radius: 999px; font-weight: 900; padding: 6px 10px; font-size: 12px;
      background: #f6f0ff; color: var(--ink); cursor: pointer;
    }
    .filter-menu input[type="search"] {
      width: 100%; border: 2px solid #ffe1ec; border-radius: 12px;
      padding: 6px 8px; font-weight: 800; font-size: 14px;
    }
    .filter-menu .opts { overflow: auto; text-align: left; flex: 1; min-height: 80px; }
    .filter-menu label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 2px; font-weight: 800; font-size: 13px; cursor: pointer; }
    .filter-menu label input { margin-top: 2px; }

    .modal { position: fixed; inset: 0; background: rgba(59,42,74,0.4); display: none; place-items: center; z-index: 20; padding: 16px; }
    .modal.show { display: grid; }
    .modal-card { width: min(360px, 100%); background: #fff; border-radius: 24px; padding: 18px; text-align: center; }
    .modal-card input {
      width: 100%; border: 3px solid #ffe1ec; border-radius: 14px;
      padding: 10px; font-size: 20px; font-weight: 800; text-align: center; margin: 10px 0;
    }
    canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

    @media (max-height: 720px) {
      .digit { width: 54px; height: 64px; font-size: 32px; border-radius: 16px; }
      .gap { width: 28px; height: 64px; }
      .key { min-width: 36px; height: 34px; font-size: 15px; }
      .mascot { width: 56px; height: 56px; font-size: 28px; }
      .teacher-btn, .login-acts .teacher-btn { width: 52px; height: 52px; min-width: 52px; flex-basis: 52px; font-size: 12px; }
      .answer-input { min-height: 46px; max-height: 58px; font-size: 20px; }
      .mic { height: 46px; min-width: 132px; font-size: 14px; }
    }
    @media (max-width: 700px) {
      .digit { width: 44px; height: 54px; font-size: 26px; }
      .gap { width: 22px; height: 54px; }
      .keys { flex-wrap: wrap; }
    }
    @media print {
      html, body, .app, .screen.active { position: static; height: auto; overflow: visible; }
      .no-print, canvas, .report, .modal, .filter-menu, .filter-btn { display: none !important; }
      .records { overflow: visible; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="app">
    <section id="screen-login" class="screen active">
      <div class="card login">
        <div class="mascot">✂️</div>
        <h1 class="title" id="titleWave"></h1>
        <div class="field">
          <label for="classId">班別</label>
          <input id="classId" maxlength="8" placeholder="5A" autocomplete="off" />
        </div>
        <div class="field">
          <label for="studentId">學號</label>
          <input id="studentId" maxlength="6" placeholder="01" inputmode="numeric" autocomplete="off" />
        </div>
        <button class="candy pink start" id="startBtn">開始任務</button>
        <div class="login-acts">
          <button class="candy mint teacher-btn" id="rankBtn">學生<br>排行</button>
          <button class="candy lilac teacher-btn" id="teacherBtn">老師<br>後台</button>
        </div>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <div class="topbar">
        <div class="pill" id="playerPill">5A 01</div>
        <div class="pill" id="qPill">第 1 題</div>
        <div class="timer-wrap">
          <div class="pill timer" id="timer">⏱️ 03:00</div>
          <span class="time-hit" id="timeHit" aria-hidden="true">−5秒</span>
        </div>
        <button class="candy ghost tiny no-print" id="backLoginBtn">主頁</button>
      </div>
      <div class="card play">
        <div id="taskCut" style="flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;">
          <div class="task-h">
            <h2>任務一：四位切一刀</h2>
            <p>由右起數 4 位</p>
          </div>
          <div class="board" id="numberBoard"></div>
          <div class="toast" id="cutToast"></div>
          <div class="okbar" id="cutSuccess">
            <button class="candy mint" id="toReadBtn">確認</button>
          </div>
        </div>

        <div id="taskRead" style="flex:1;min-height:0;display:none;flex-direction:column;gap:6px;">
          <div class="task-h">
            <h2>任務二：看線讀數</h2>
            <p>🎤 語音輸入　·　按鍵拼字</p>
          </div>
          <div class="segs" id="segmentPreview"></div>
          <div class="dictation" id="dictationArea">
            <div class="answer-label">中國數字答案框</div>
            <textarea id="answerBox" class="answer-input" rows="2" maxlength="80" placeholder="🎤 語音輸入　或　按鍵拼字" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
            <div class="speak-row">
              <div class="langs">
                <button id="langHK" class="on" type="button">粵</button>
                <button id="langCN" type="button">普</button>
              </div>
              <button class="mic" id="micBtn" type="button">🎤 語音輸入</button>
            </div>

        const n = digits.length;
        const need = requiredCuts(digits);
        const cutsMap = Object.fromEntries(need.map((c) => [c.index, c.label]));
        const allDone = cutsComplete(digits);
        const parts = [];
        for (let i = 0; i < n; i++) {
          parts.push(`<div class="digit">${digits[i]}</div>`);
          if (i < n - 1) {
            const label = cutsMap[i];
            if (state.cuts.has(i) && label) {
              parts.push(`<button class="gap cut"><span class="flag ${label === "億" ? "yi" : ""}">${label}</span></button>`);
            } else if (allDone) {
              parts.push(`<span class="gap cut"></span>`);
            } else {
              parts.push(`<button class="gap" data-gap="${i}"></button>`);
            }
          }
        }
        $("numberBoard").innerHTML = `<div class="number-row">${parts.join("")}</div>`;
        $("numberBoard").querySelectorAll(".gap[data-gap]").forEach((btn) => {
          btn.addEventListener("click", () => onCut(Number(btn.dataset.gap)));
        });
        requestAnimationFrame(fitRow);
        setTimeout(fitRow, 60);
      }

      function classifyCutError(gapIndex, digits) {
        const n = digits.length;
        const cuts = requiredCuts(digits);
        const wan = cuts.find((c) => c.label === "萬");
        const yi = cuts.find((c) => c.label === "億");
        if (wan && gapIndex > wan.index) return "未由右起數足4位";
        if (n >= 9 && gapIndex === 3) return "從左邊隨意劃線";
        if (yi && wan && state.cuts.has(wan.index) && !state.cuts.has(yi.index)) return "漏劃億字線";
        if (wan && gapIndex < wan.index) return "從左邊隨意劃線";
        return "劃線位置不正確";
      }
      function showToast(id, text) {
        const el = $(id);
        el.textContent = text;
        el.classList.add("show", "shake");
        setTimeout(() => el.classList.remove("shake"), 400);
      }
      function onCut(gapIndex) {
        if (state.ended || cutsComplete(state.digits)) return;
        const hit = requiredCuts(state.digits).find((c) => c.index === gapIndex);
        bounce($("numberBoard"));
        if (!hit) {
          sfx("bad");
          applyPenalty();
          state.cutErrors += 1;
          showToast("cutToast", "由右起數 4 位");
          return;
        }
        sfx("cut");
        state.cuts.add(gapIndex);
        $("cutToast").classList.remove("show");
        renderCutBoard();
        if (cutsComplete(state.digits)) {
          sfx("ok");
          burstConfetti(70);
          $("cutSuccess").classList.add("show");
        }
      }

      function segmentedPreview(digits) {
        const cuts = requiredCuts(digits).sort((a, b) => a.index - b.index);
        let html = "", start = 0;
        cuts.forEach((cut) => {
          html += `<div class="seg">${digits.slice(start, cut.index + 1)}<b>${cut.label}</b></div>`;
          start = cut.index + 1;
        });
        html += `<div class="seg">${digits.slice(start)}</div>`;
        return html;
      }

      function answerEl() { return $("answerBox"); }
      function focusAnswer() {
        const el = answerEl();

        try { el.setSelectionRange(n, n); } catch (e) {}
      }
      function setAnswer(text, live) {
        const el = answerEl();
        el.value = text;
        el.classList.toggle("live", !!live);
      }
      function getAnswerRaw() { return answerEl().value || ""; }
      function insertAnswer(token) {
        const el = answerEl();
        const start = el.selectionStart ?? el.value.length;
        const end = el.selectionEnd ?? el.value.length;
        el.value = el.value.slice(0, start) + token + el.value.slice(end);
        const pos = start + token.length;
        el.focus();
        try { el.setSelectionRange(pos, pos); } catch (e) {}
      }
      function deleteAnswer() {
        const el = answerEl();
        const start = el.selectionStart ?? el.value.length;
        const end = el.selectionEnd ?? el.value.length;
        if (start !== end) {
          el.value = el.value.slice(0, start) + el.value.slice(end);
          try { el.setSelectionRange(start, start); } catch (e) {}
        } else if (start > 0) {
          el.value = el.value.slice(0, start - 1) + el.value.slice(end);
          try { el.setSelectionRange(start - 1, start - 1); } catch (e) {}
        }
        el.focus();
      }

      function classifyReadError(got, expected) {
        const zerosExp = (expected.match(/零/g) || []).length;
        const zerosGot = (got.match(/零/g) || []).length;
        const stripped = (s) => s.replace(/零/g, "");
        if (zerosGot < zerosExp || (stripped(got) === stripped(expected) && got !== expected)) return "讀數漏點零";
        const places = ["億", "萬", "千", "百", "十"];
        const pick = (s) => [...s].filter((ch) => places.includes(ch)).join("");
        if (pick(got) !== pick(expected)) return "讀數位值拼湊錯誤";
        return "讀數數字拼湊錯誤";
      }

      function passRead() {
        if (state.ended) return;
        stopListen(true);
        const sec = Math.max(1, Math.round((Date.now() - state.qStart) / 1000));
        state.qTimes.push(sec);
        state.done += 1;
        sfx("ok");
        $("readToast").classList.remove("show");
        burstConfetti(90);
        if (state.remain <= 0) { endSession(); return; }
        setTimeout(() => {
          if (state.ended) return;
          state.qIndex += 1;
          newQuestion();
        }, 450);
      }
      function failRead(got) {
        sfx("bad");
        applyPenalty();
        const kind = classifyReadError(got, state.readings[0]);
        if (kind === "讀數漏點零") state.readZeroErrors += 1;
        else state.readOtherErrors += 1;
        showToast("readToast", "留意 零／位值");
        focusAnswer();
      }
      function submitRead() {
        if (state.ended) return;
        const got = normalizeReading(getAnswerRaw());
        bounce(answerEl());
        if (!got) { showToast("readToast", "🎤 語音輸入　或　按鍵拼字"); sfx("bad"); focusAnswer(); return; }
        setAnswer(got);
        if (state.readings.includes(got)) passRead();
        else failRead(got);
      }

      function unlockMicNow() {
        const btn = $("micBtn");
        if (!btn) return;
        btn.disabled = false;
        btn.removeAttribute("disabled");
        btn.classList.remove("off", "listen");
        btn.style.pointerEvents = "auto";
        btn.style.opacity = "1";
        btn.style.filter = "none";
        btn.textContent = "🎤 語音輸入";
        state.listening = false;
      }
      function resetSpeechMemory() {
        sessionFinal = "";
        state.userEdited = false;
        if (rec) {
          try { rec.onresult = null; rec.onerror = null; rec.onend = null; } catch (e) {}
        }
      }
      function recoverMic() {
        unlockMicNow();
        clearTimeout(recoverTimer);
        recoverTimer = setTimeout(unlockMicNow, 100);
      }
      function killRec() {
        if (!rec) return;
        try {
          rec.onresult = null;
          rec.onerror = null;
          rec.onend = null;
          rec.abort();
        } catch (e) {
          try { rec.stop(); } catch (e2) {}
        }
        rec = null;
      }
      function writeLive(finalPart, interimPart) {
        if (state.userEdited) return;
        setAnswer(normalizeReading((finalPart || "") + (interimPart || "")), true);
      }
      function startListen() {
        clearTimeout(recoverTimer);
        if (!SpeechRec) {
          showToast("readToast", SPEECH_FAIL);
          recoverMic();
          focusAnswer();
          return;
        }
        killRec();
        resetSpeechMemory();
        try {
          rec = new SpeechRec();
          rec.lang = state.lang;
          rec.interimResults = true;
          rec.continuous = true;
          rec.maxAlternatives = 3;
          rec.onresult = (e) => {
            let interim = "", finals = "";
            for (let i = 0; i < e.results.length; i++) {
              const t = e.results[i][0].transcript;
              if (e.results[i].isFinal) finals += t;
              else interim += t;
            }
            sessionFinal = finals;
            writeLive(finals, interim);
          };
          rec.onerror = (e) => {
            if (e.error !== "aborted" && e.error !== "no-speech") showToast("readToast", SPEECH_FAIL);
            recoverMic();
            focusAnswer();
          };
          rec.onend = () => {
            recoverMic();
            answerEl().classList.remove("live");
            if (!state.userEdited && sessionFinal) setAnswer(normalizeReading(sessionFinal), false);
            focusAnswer();
          };
          rec.start();
          state.listening = true;
          $("micBtn").disabled = false;
          $("micBtn").classList.add("listen");
          $("readToast").classList.remove("show");
        } catch (err) {
          showToast("readToast", SPEECH_FAIL);
          recoverMic();
          focusAnswer();
        }
      }
      function stopListen(silent) {
        killRec();
        recoverMic();
        answerEl().classList.remove("live");
        if (!silent && !state.userEdited && sessionFinal) setAnswer(normalizeReading(sessionFinal), false);
      }

      function newQuestion() {
        if (state.ended) return;
        stopListen(true);
        state.digits = genNumber();
        state.readings = readingsFor(state.digits);
        state.cuts = new Set();
        state.qStart = Date.now();
        sessionFinal = "";
        state.userEdited = false;
        $("playerPill").textContent = `${state.classId} ${normalizeId(state.studentId)}`;
        $("qPill").textContent = `第 ${state.qIndex} 題`;
        $("taskCut").style.display = "flex";
        $("taskRead").style.display = "none";
        $("cutSuccess").classList.remove("show");
        $("cutToast").classList.remove("show");
        $("readToast").classList.remove("show");
        setAnswer("");
        renderCutBoard();
      }

      function startGame() {
        const classId = $("classId").value.trim().toUpperCase();
        const studentId = $("studentId").value.trim();
        if (!classId || !studentId) { bounce($("startBtn")); return; }
        unlockAudio();
        state.classId = classId;
        state.studentId = studentId;
        state.qIndex = 1;
        state.done = 0;
        state.qTimes = [];
        state.cutErrors = 0;
        state.readZeroErrors = 0;
        state.readOtherErrors = 0;
        state.ended = false;
        state.sheetSent = false;
        $("reportModal").classList.remove("show");
        ensureStudent();
        showScreen("game");
        startCountdown();
        newQuestion();
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"'`]/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;"
        }[c]));
      }

      function cmpStudent(a, b) {
        if (a.classId !== b.classId) return String(a.classId).localeCompare(String(b.classId), "zh-Hant");
        const na = parseInt(a.studentId, 10), nb = parseInt(b.studentId, 10);
        if (!Number.isNaN(na) && !Number.isNaN(nb) && na !== nb) return na - nb;
        return String(a.studentId).localeCompare(String(b.studentId), "zh-Hant", { numeric: true });
      }
      function timeDay(t) {
        const s = String(t || "");
        const m = s.match(/^\d{4}\/\d{2}\/\d{2}/);
        return m ? m[0] : (s || "（空白）");
      }
      function colValue(key, e) {
        if (key === "student") return `${e.classId} ${e.studentId}`.trim() || "（空白）";
        if (key === "score") return String(e.done);
        if (key === "avg") return e.avgSec ? String(e.avgSec) : "—";
        if (key === "diagnosis") return e.diagnosis || "（空白）";
        return timeDay(e.time);
      }
      function classLogs() {
        if (!dashClass || dashClass === "ALL") return dashAllLogs;
        return dashAllLogs.filter((e) => e.classId === dashClass);
      }
      function uniqueValues(key) {
        const set = new Set();
        classLogs().forEach((e) => set.add(colValue(key, e)));
        const arr = [...set];
        const spec = DASH_COLS.find((c) => c.key === key);
        arr.sort((a, b) => {
          if (spec && spec.numeric) {
            const na = Number(a), nb = Number(b);
            const fa = Number.isFinite(na), fb = Number.isFinite(nb);
            if (fa && fb) return na - nb;
            if (fa) return -1;
            if (fb) return 1;
          }
          return String(a).localeCompare(String(b), "zh-Hant", { numeric: true });
        });
        return arr;
      }
      function filterActive(key) {
        const sel = dashFilters[key];
        return !!(sel && sel.size < uniqueValues(key).length);
      }
      function anyFilterOn() {
        return DASH_COLS.some((c) => filterActive(c.key));
      }
      function passesFilters(e) {
        return DASH_COLS.every((col) => {
          const sel = dashFilters[col.key];
          if (!sel) return true;
          return sel.has(colValue(col.key, e));
        });
      }
      function sortLogs(logs) {
        const col = dashSort.col;
        const m = dashSort.dir === "asc" ? 1 : -1;
        return logs.slice().sort((a, b) => {
          let c = 0;
          if (col === "score") c = a.done - b.done;
          else if (col === "avg") c = (a.avgSec || 0) - (b.avgSec || 0);
          else if (col === "student") c = cmpStudent(a, b);
          else if (col === "time") c = String(a.time || "").localeCompare(String(b.time || ""));
          else if (col === "diagnosis") c = String(a.diagnosis || "").localeCompare(String(b.diagnosis || ""), "zh-Hant");
          return (c * m) || cmpStudent(a, b);
        });
      }
      function sortMark(key) {
        if (dashSort.col !== key) return "";
        return dashSort.dir === "asc" ? " ▲" : " ▼";
      }
      function closeFilterMenu() {
        dashMenuCol = "";
        const menu = $("dashFilterMenu");
        if (menu) menu.classList.remove("show");
      }
      function resetDashFilters() {
        dashFilters = {};
        dashSort = { col: "score", dir: "desc" };
        dashClass = "ALL";
        closeFilterMenu();
      }
      function placeFilterMenu(anchor) {
        const menu = $("dashFilterMenu");
        const r = anchor.getBoundingClientRect();
        menu.classList.add("show");
        const w = menu.offsetWidth || 260;
        const h = menu.offsetHeight || 280;
        let left = Math.min(r.left, window.innerWidth - w - 8);
        let top = r.bottom + 4;
        if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 4);
        if (left < 8) left = 8;
        menu.style.left = left + "px";
        menu.style.top = top + "px";
      }
      function renderFilterMenu(key, q) {
        const spec = DASH_COLS.find((c) => c.key === key);
        if (!spec) return;
        const values = uniqueValues(key);
        const sel = dashFilters[key];
        const query = String(q || "").trim();
        const shown = query ? values.filter((v) => String(v).indexOf(query) !== -1) : values;
        const allOn = !sel;
        const sortDesc = key === "time" ? "新 → 舊" : (spec.numeric ? "由高到低" : "由 Z 到 A");
        const sortAsc = key === "time" ? "舊 → 新" : (spec.numeric ? "由低到高" : "由 A 到 Z");
        $("dashFilterMenu").innerHTML = `
          <div class="fm-title">篩選：${escapeHtml(spec.label)}</div>
          <div class="fm-acts">
            <button type="button" data-fm="sort-desc">${sortDesc}</button>
            <button type="button" data-fm="sort-asc">${sortAsc}</button>
          </div>
          <input type="search" id="fmSearch" placeholder="搜尋" value="${escapeHtml(query)}" />
          <div class="fm-acts">
            <button type="button" data-fm="all">全選</button>
            <button type="button" data-fm="none">全不選</button>
            <button type="button" data-fm="clear">清除此欄</button>
          </div>
          <div class="opts">
            ${shown.map((v) => {
              const on = allOn || sel.has(v);
              const idx = values.indexOf(v);
              return `<label><input type="checkbox" data-idx="${idx}" ${on ? "checked" : ""} />${escapeHtml(v)}</label>`;
            }).join("") || `<div class="empty">沒有項目</div>`}
          </div>
        `;
        const search = $("fmSearch");
        if (search) {
          search.focus();
          const n = search.value.length;
          try { search.setSelectionRange(n, n); } catch (err) {}
        }
      }
      function openFilterMenu(key, anchor) {
        dashMenuCol = key;
        renderFilterMenu(key, "");
        placeFilterMenu(anchor);
      }
      function setColFilter(key, nextSet) {
        const all = uniqueValues(key);
        if (!nextSet || nextSet.size === all.length) dashFilters[key] = null;
        else dashFilters[key] = nextSet;
        paintDash();
        if (dashMenuCol === key) {
          const q = ($("fmSearch") && $("fmSearch").value) || "";
          renderFilterMenu(key, q);
          const btn = document.querySelector(`.filter-btn[data-filter="${key}"]`);
          if (btn) placeFilterMenu(btn);
        }
      }
      function paintDash() {
        DASH_COLS.forEach((col) => {
          const sel = dashFilters[col.key];
          if (!sel) return;
          const all = new Set(uniqueValues(col.key));
          const next = new Set([...sel].filter((v) => all.has(v)));
          dashFilters[col.key] = next.size === all.size ? null : next;
        });
        const sourceEl = $("dashSource");
        const base = classLogs();
        const logs = base.filter(passesFilters);
        const avgDone = logs.length ? Math.round((logs.reduce((n, e) => n + (e.done || 0), 0) / logs.length) * 10) / 10 : 0;
        const cutTotal = logs.reduce((n, e) => n + (e.cutErrors || 0), 0);
        const readTotal = logs.reduce((n, e) => n + (e.readErrors || 0), 0);
        const classes = [...new Set(dashAllLogs.map((s) => s.classId).filter(Boolean))].sort();
        $("classFilter").innerHTML = `<option value="ALL">全部班別</option>` +
          classes.map((c) => `<option value="${escapeHtml(c)}" ${c === dashClass ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");
        $("analysisCards").innerHTML = `
          <div class="stat s1"><b>平均 3 分鐘完成題數</b><strong>${logs.length ? avgDone : "—"}</strong></div>
          <div class="stat s2"><b>劃線需加強人次</b><strong>${cutTotal}</strong></div>
          <div class="stat s3"><b>讀數需加強人次</b><strong>${readTotal}</strong></div>
        `;
        if ($("dashCount")) {
          $("dashCount").textContent = dashAllLogs.length ? `顯示 ${logs.length} / ${base.length} 筆` : "";
        }
        if ($("clearFiltersBtn")) $("clearFiltersBtn").style.visibility = anyFilterOn() ? "visible" : "hidden";
        if (!dashAllLogs.length) {
          $("studentRecords").innerHTML = `<div class="empty">${sourceEl && sourceEl.textContent.indexOf("未能") >= 0 ? "未能連線 Google 試算表" : "未有紀錄"}</div>`;
          return;
        }
        const ranked = sortLogs(logs);
        const scores = ranked.map((e) => e.done || 0).slice().sort((a, b) => a - b);
        const hiCut = scores.length ? scores[Math.max(0, scores.length - Math.ceil(scores.length * 0.2))] || 0 : 0;
        const loCut = scores.length ? scores[Math.min(scores.length - 1, Math.floor(scores.length * 0.2))] || 0 : 0;
        const showRank = dashSort.col === "score";
        const head = (key, extra) => {
          const spec = DASH_COLS.find((c) => c.key === key);
          const on = filterActive(key);
          const sorted = dashSort.col === key ? " sorted" : "";
          return `<th class="col-h${extra || ""}${sorted}" data-col="${key}">
            <button type="button" class="col-sort" data-sort="${key}">${escapeHtml(spec.label)}${sortMark(key)}</button>
            <button type="button" class="filter-btn${on ? " on" : ""}" data-filter="${key}" aria-label="篩選${escapeHtml(spec.label)}">▼</button>
          </th>`;
        };
        const body = ranked.length ? ranked.map((e, i) => {
          const rank = dashSort.dir === "asc" ? ranked.length - i : i + 1;
          const hi = e.done >= hiCut && e.done > 0;
          const lo = e.done <= loCut;
          return `<tr class="${hi ? "hi" : lo ? "lo" : ""}">
            ${showRank ? `<td class="rank-cell">${rank}</td>` : ""}
            <td>${escapeHtml(e.classId)} ${escapeHtml(e.studentId)}</td>
            <td class="score-cell">${e.done}</td>
            <td>${e.avgSec || "—"}</td>
            <td>${escapeHtml(e.diagnosis)}</td>
            <td>${escapeHtml(e.time)}</td>
          </tr>`;
        }).join("") : `<tr><td colspan="${showRank ? 6 : 5}" class="empty">呢組篩選冇紀錄，可再撳 ▼ 改篩選</td></tr>`;
        $("studentRecords").innerHTML = `<table>
          <thead><tr>
            ${showRank ? `<th class="score-h">名次</th>` : ""}
            ${head("student")}
            ${head("score", " score-h")}
            ${head("avg")}
            ${head("diagnosis")}
            ${head("time")}
          </tr></thead>
          <tbody>${body}</tbody>
        </table>`;
      }
      function bestPerStudent(logs) {
        const map = new Map();
        (logs || []).forEach((e) => {
          if (!e.studentId && !e.classId) return;
          const key = studentKey(e.classId, e.studentId);
          const prev = map.get(key);
          const better = !prev
            || (e.done || 0) > (prev.done || 0)
            || ((e.done || 0) === (prev.done || 0) && (e.avgSec || 99999) < (prev.avgSec || 99999));
          if (better) map.set(key, e);
        });
        return [...map.values()]
          .filter((e) => (e.done || 0) > 0)
          .sort((a, b) => {
            if ((b.done || 0) !== (a.done || 0)) return (b.done || 0) - (a.done || 0);
            const ta = a.avgSec || 99999, tb = b.avgSec || 99999;
            if (ta !== tb) return ta - tb;
            return cmpStudent(a, b);
          })
          .slice(0, 10);
      }
      async function renderRank(force) {
        const seq = ++rankSeq;
        const box = $("rankRecords");
        if (!box) return;
        box.innerHTML = `<div class="empty">載入排行榜…</div>`;
        let logs = [];
        let fail = false;
        try { logs = await loadSheetLogs(!!force); }
        catch (err) { fail = true; }
        if (seq !== rankSeq) return;
        if (fail) {
          box.innerHTML = `<div class="empty">未能連線 Google 試算表</div>`;
          return;
        }
        const top = bestPerStudent(logs);
        if (!top.length) {
          box.innerHTML = `<div class="empty">未有紀錄</div>`;
          return;
        }
        box.innerHTML = `<table>
          <thead><tr>
            <th class="score-h">名次</th>
            <th>班別學號</th>
            <th class="score-h">答對題數</th>
          </tr></thead>
          <tbody>${top.map((e, i) => {
            const n = i + 1;
            const cls = n === 1 ? "r1" : n === 2 ? "r2" : n === 3 ? "r3" : "";
            return `<tr class="${cls}">
              <td class="rank-cell">${n}</td>
              <td>${escapeHtml(e.classId)} ${escapeHtml(e.studentId)}</td>
              <td class="score-cell">${e.done || 0}</td>
            </tr>`;
          }).join("")}</tbody>
        </table>`;
      }
      async function renderDashboard(filterClass, force) {
        const seq = ++dashSeq;
        if (filterClass) dashClass = filterClass;
        $("studentRecords").innerHTML = `<div class="empty">載入全班分數…</div>`;
        $("analysisCards").innerHTML = `
          <div class="stat s1"><b>平均 3 分鐘完成題數</b><strong>…</strong></div>
          <div class="stat s2"><b>劃線需加強人次</b><strong>…</strong></div>
          <div class="stat s3"><b>讀數需加強人次</b><strong>…</strong></div>
        `;
        let source = "";
        try {
          dashAllLogs = await loadSheetLogs(!!force);
          source = "Google 試算表";
        } catch (err) {
          dashAllLogs = loadStore().logs;
          source = "本機（未能連線試算表）";
        }
        if (seq !== dashSeq) return;
        if ($("dashSource")) $("dashSource").textContent = source;
        paintDash();
      }

      const canvas = $("confetti");
      const ctx = canvas.getContext("2d");
      let pieces = [];
      function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener("resize", () => { resizeCanvas(); fitRow(); });
      resizeCanvas();
      function burstConfetti(count) {
        const colors = ["#ff8fab", "#7ce0c3", "#ffe066", "#cbb2fe", "#8ecaff", "#ffc09f"];
        for (let i = 0; i < count; i++) {
          pieces.push({
            x: canvas.width * (0.2 + Math.random() * 0.6), y: -12,
            r: 4 + Math.random() * 6, c: colors[i % colors.length],
            vx: -3 + Math.random() * 6, vy: 3 + Math.random() * 5,
            rot: Math.random() * 360, vr: -8 + Math.random() * 16,
            life: 80 + Math.random() * 40, shape: i % 3
          });
        }
      }
      (function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces = pieces.filter((p) => p.life > 0);
        pieces.forEach((p) => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vr; p.life -= 1;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
          ctx.globalAlpha = Math.max(0, p.life / 70); ctx.fillStyle = p.c;
          if (p.shape === 0) ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          else if (p.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill(); }
          else { ctx.beginPath(); ctx.moveTo(0, -p.r); ctx.lineTo(p.r, p.r); ctx.lineTo(-p.r, p.r); ctx.fill(); }
          ctx.restore();
        });
        requestAnimationFrame(tick);
      })();

      renderKeys();
      recoverMic();

      $("startBtn").addEventListener("click", startGame);
      $("rankBtn").addEventListener("click", () => {
        showScreen("rank");
        renderRank(true);
      });
      $("rankBackBtn").addEventListener("click", () => showScreen("login"));
      $("rankRefreshBtn").addEventListener("click", () => renderRank(true));
      $("teacherBtn").addEventListener("click", () => {
        $("pinModal").classList.add("show");
        $("pinInput").value = "";
        $("pinInput").focus();
      });
      $("pinCancel").addEventListener("click", () => $("pinModal").classList.remove("show"));
      $("pinOk").addEventListener("click", () => {
        if ($("pinInput").value === TEACHER_PIN) {
          $("pinModal").classList.remove("show");
          resetDashFilters();
          showScreen("dash");
          renderDashboard("ALL", true);
        } else {
          bounce($("pinInput"));
          $("pinInput").classList.add("shake");
          setTimeout(() => $("pinInput").classList.remove("shake"), 400);
          $("pinInput").value = "";
        }
      });
      $("pinInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pinOk").click(); });
      $("dashBackBtn").addEventListener("click", () => { closeFilterMenu(); showScreen("login"); });
      $("backLoginBtn").addEventListener("click", () => {
        if (!state.ended && (state.done > 0 || state.cutErrors + state.readZeroErrors + state.readOtherErrors > 0)) {
          endSession();
          return;
        }
        $("studentId").value = "";
        $("reportModal").classList.remove("show");
        showScreen("login");
        $("studentId").focus();
      });
      $("reportBackBtn").addEventListener("click", () => {
        $("reportModal").classList.remove("show");
        $("studentId").value = "";
        showScreen("login");
        $("studentId").focus();
      });
      $("printBtn").addEventListener("click", () => window.print());
      $("classFilter").addEventListener("change", (e) => {
        dashClass = e.target.value || "ALL";
        closeFilterMenu();
        paintDash();
      });
      $("clearFiltersBtn").addEventListener("click", () => {
        dashFilters = {};
        closeFilterMenu();
        paintDash();
      });
      $("studentRecords").addEventListener("click", (e) => {
        const fb = e.target.closest(".filter-btn");
        if (fb) {
          e.stopPropagation();
          const key = fb.getAttribute("data-filter");
          if (dashMenuCol === key && $("dashFilterMenu").classList.contains("show")) closeFilterMenu();
          else openFilterMenu(key, fb);
          return;
        }
        const sb = e.target.closest(".col-sort");
        if (!sb) return;
        const key = sb.getAttribute("data-sort");
        if (dashSort.col === key) dashSort.dir = dashSort.dir === "desc" ? "asc" : "desc";
        else dashSort = { col: key, dir: (key === "student" || key === "diagnosis") ? "asc" : "desc" };
        paintDash();
      });
      $("dashFilterMenu").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-fm]");
        if (!btn || !dashMenuCol) return;
        const act = btn.getAttribute("data-fm");
        const key = dashMenuCol;
        if (act === "sort-desc") { dashSort = { col: key, dir: "desc" }; paintDash(); }
        else if (act === "sort-asc") { dashSort = { col: key, dir: "asc" }; paintDash(); }
        else if (act === "all" || act === "clear") setColFilter(key, null);
        else if (act === "none") setColFilter(key, new Set());
        if (act === "sort-desc" || act === "sort-asc") {
          const anchor = document.querySelector(`.filter-btn[data-filter="${key}"]`);
          if (anchor) placeFilterMenu(anchor);
        }
      });
      $("dashFilterMenu").addEventListener("change", (e) => {
        const inp = e.target;
        if (!inp.matches || !inp.matches("input[type='checkbox'][data-idx]")) return;
        const key = dashMenuCol;
        const values = uniqueValues(key);
        const val = values[Number(inp.getAttribute("data-idx"))];
        if (val == null) return;
        const all = values;
        const sel = dashFilters[key] ? new Set(dashFilters[key]) : new Set(all);
        if (inp.checked) sel.add(val); else sel.delete(val);
        setColFilter(key, sel);
      });
      $("dashFilterMenu").addEventListener("input", (e) => {
        if (e.target.id !== "fmSearch" || !dashMenuCol) return;
        renderFilterMenu(dashMenuCol, e.target.value);
        const btn = document.querySelector(`.filter-btn[data-filter="${dashMenuCol}"]`);
        if (btn) placeFilterMenu(btn);
      });
      document.addEventListener("click", (e) => {
        const menu = $("dashFilterMenu");
        if (!menu || !menu.classList.contains("show")) return;
        if (menu.contains(e.target) || e.target.closest(".filter-btn")) return;
        closeFilterMenu();
      });
      $("refreshDashBtn").addEventListener("click", () => renderDashboard($("classFilter").value || "ALL", true));
      $("toReadBtn").addEventListener("click", enterRead);
      $("submitReadBtn").addEventListener("click", submitRead);

      answerEl().addEventListener("compositionstart", () => { state.composing = true; });
      answerEl().addEventListener("compositionend", () => {
        state.composing = false;
        const el = answerEl();
        const pos = el.selectionStart;
        const next = normalizeReading(el.value);
        if (next !== el.value) {
          el.value = next;
          try { el.setSelectionRange(Math.min(pos, next.length), Math.min(pos, next.length)); } catch (e) {}
        }
      });
      answerEl().addEventListener("input", () => {
        state.userEdited = true;
        if (state.composing) return;
        const el = answerEl();
        const pos = el.selectionStart;
        const next = el.value.replace(/[０-９]/g, (ch) => String(ch.charCodeAt(0) - 65296)).replace(/[0-9]/g, (d) => HAN[Number(d)]);
        if (next !== el.value) {
          el.value = next;
          try { el.setSelectionRange(Math.min(pos, next.length), Math.min(pos, next.length)); } catch (e) {}
        }
      });
      answerEl().addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !state.composing) { e.preventDefault(); submitRead(); }
      });
      $("langHK").addEventListener("click", () => { state.lang = "zh-HK"; $("langHK").classList.add("on"); $("langCN").classList.remove("on"); });
      $("langCN").addEventListener("click", () => { state.lang = "zh-CN"; $("langCN").classList.add("on"); $("langHK").classList.remove("on"); });

      $("micBtn").addEventListener("click", (e) => {
        e.preventDefault();
        bounce($("micBtn"));
        if (state.listening) { stopListen(true); focusAnswer(); }
        else startListen();
      });
      ["classId", "studentId"].forEach((id) => {
        $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") startGame(); });
      });
    })();
  </script>
</body>
</html>
